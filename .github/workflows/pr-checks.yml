# Checks complementarios de GitHub Actions para ArrowOps.
# Azure Pipelines (azure-pipelines.yml) sigue siendo el CI principal y genera el artefacto;
# este workflow agrega pruebas en Linux con varias versiones de Node y la revision de
# dependencias que introduce cada PR.

name: PR checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build y pruebas (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    # PostgreSQL efimero para las pruebas de integracion (tests/contract/postgres.test.js).
    # La contrasena viene de un secreto del repositorio; nunca esta en el codigo.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: arrowops
          POSTGRES_USER: arrowops
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arrowops -d arrowops"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://arrowops:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/arrowops
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar sintaxis (build)
        run: npm run build

      - name: Verificar que el secreto de la base de datos existe
        env:
          PG_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: test -n "$PG_PASSWORD" || { echo "::error::Falta el secreto POSTGRES_PASSWORD (Settings > Secrets and variables)"; exit 1; }

      - name: Pruebas (incluye integracion con PostgreSQL)
        run: npm run test:ci

      - name: Audit de dependencias de produccion
        run: npm audit --omit=dev --audit-level=high

  dependency-review:
    name: Revision de dependencias
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Falla si el PR agrega dependencias con vulnerabilidades moderadas o mas graves.
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate

  secret-scan:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # gitleaks lista los commits del PR
    steps:
      # Historial completo: gitleaks revisa todos los commits, no solo el ultimo.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
