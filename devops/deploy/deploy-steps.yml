# Pasos de despliegue de un ambiente de ArrowOps. Los usan Deploy_dev y Deploy_prod
# en azure-pipelines.yml, asi ambos ambientes se despliegan exactamente igual.
parameters:
  - name: project        # proyecto de Docker Compose (aisla contenedores y volumenes)
    type: string
  - name: port           # puerto del host donde queda publicada la app
    type: string
  - name: postgresPassword
    type: string

steps:
  - checkout: self
    displayName: Checkout (archivos de despliegue)

  - download: current
    artifact: arrowops
    displayName: Descargar artefacto del CI

  # Debe haber exactamente un artefacto: el workspace del agente autohospedado puede
  # conservar archivos de ejecuciones anteriores (fallo F-04). En los tags, la version
  # del artefacto tiene que coincidir con la del tag.
  - powershell: |
      $tgz = @(Get-ChildItem "$(Pipeline.Workspace)/arrowops/arrowops-*.tgz")
      if ($tgz.Count -ne 1) {
        Write-Host "##vso[task.logissue type=error]Se esperaba 1 artefacto y hay $($tgz.Count): $($tgz.Name -join ', ')"
        exit 1
      }
      $version = $tgz[0].BaseName -replace '^arrowops-', ''
      $ref = '$(Build.SourceBranch)'
      if ($ref -like 'refs/tags/v*' -and $version -ne $ref.Substring(11)) {
        Write-Host "##vso[task.logissue type=error]El artefacto es $version pero el tag es $($ref.Substring(10))"
        exit 1
      }
      $imageTag = "$version-$(Build.BuildId)"
      Write-Host "Artefacto: $($tgz[0].Name) -> version $version, imagen arrowops:$imageTag"
      Write-Host "##vso[task.setvariable variable=APP_VERSION]$version"
      Write-Host "##vso[task.setvariable variable=APP_IMAGE_TAG]$imageTag"
    displayName: Resolver y verificar version del artefacto

  # Etiqueta inmutable por ejecucion (version-build): dos builds distintos nunca comparten imagen.
  - script: docker build -f devops/deploy/Dockerfile -t arrowops:$(APP_IMAGE_TAG) "$(Pipeline.Workspace)/arrowops"
    displayName: Construir imagen arrowops:$(APP_IMAGE_TAG) desde el artefacto

  - script: docker compose -p ${{ parameters.project }} -f devops/deploy/docker-compose.yml up -d --wait
    displayName: Desplegar ${{ parameters.project }} (puerto ${{ parameters.port }})
    env:
      APP_IMAGE_TAG: $(APP_IMAGE_TAG)
      APP_PORT: ${{ parameters.port }}
      POSTGRES_PASSWORD: ${{ parameters.postgresPassword }}
  # Validacion posterior al despliegue: la app responde y corre la version esperada.
  - powershell: |
      $url = "http://localhost:${{ parameters.port }}/health"
      for ($i = 1; $i -le 10; $i++) {
        try {
          $health = Invoke-RestMethod $url -TimeoutSec 5
          if ($health.status -eq 'ok' -and $health.version -eq '$(APP_VERSION)') {
            Write-Host "Health check OK: $url -> version $($health.version)"
            exit 0
          }
          Write-Host "Intento ${i}: version $($health.version), se espera $(APP_VERSION)"
        } catch {
          Write-Host "Intento ${i}: sin respuesta ($($_.Exception.Message))"
        }
        Start-Sleep -Seconds 3
      }
      Write-Host "##vso[task.logissue type=error]Health check fallido en $url"
      exit 1
    displayName: Health check y verificacion de version
