<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ArrowOps</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <header class="topbar">
    <h1>ArrowOps</h1>
    <p>Gestion de incidentes de TI</p>
  </header>

  <main class="container">
    <section class="panel">
      <div class="panel-header">
        <h2 id="form-title">Nuevo incidente</h2>
      </div>
      <form id="incident-form" novalidate>
        <input type="hidden" id="incident-id">
        <div class="grid">
          <label class="span-2">Titulo
            <input id="title" maxlength="120" required>
          </label>
          <label class="span-2">Descripcion
            <textarea id="description" rows="3" maxlength="2000" required></textarea>
          </label>
          <label>Prioridad
            <select id="priority" required>
              <option value="baja">Baja</option>
              <option value="media" selected>Media</option>
              <option value="alta">Alta</option>
              <option value="critica">Critica</option>
            </select>
          </label>
          <label>Estado
            <select id="status">
              <option value="abierto">Abierto</option>
              <option value="en_progreso">En progreso</option>
              <option value="resuelto">Resuelto</option>
              <option value="cerrado">Cerrado</option>
            </select>
          </label>
          <label class="span-2">Reportado por
            <input id="reporter" maxlength="80">
          </label>
        </div>
        <p id="form-errors" class="message" hidden></p>
        <div class="actions">
          <button type="submit" id="submit-btn" class="btn btn-primary">Crear incidente</button>
          <button type="button" id="cancel-btn" class="btn" hidden>Cancelar edicion</button>
        </div>
      </form>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>Incidentes</h2>
        <label>Estado
          <select id="status-filter">
            <option value="">Todos</option>
            <option value="abierto">Abierto</option>
            <option value="en_progreso">En progreso</option>
            <option value="resuelto">Resuelto</option>
            <option value="cerrado">Cerrado</option>
          </select>
        </label>
      </div>
      <p id="message" class="message" hidden></p>
      <div id="list"></div>
    </section>
  </main>

  <script src="src/api.js"></script>
  <script src="src/form.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
