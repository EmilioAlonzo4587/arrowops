# Pipeline CI/CD de ArrowOps. Corre en el agente autohospedado.
#   CI          -> checkout, instalacion, build, pruebas, dependencias, empaquetado y artefacto (siempre)
#   Deploy_dev  -> ambiente arrowops-dev (merge a main y tags v*)
#   Deploy_prod -> ambiente arrowops-prod con aprobacion manual (solo tags v*)
# Estrategia de release: docs/release.md.

name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
  tags:
    include:
      - v*

pr:
  branches:
    include:
      - main

pool:
  name: ArrowOps-SelfHosted

variables:
  nodeVersion: '22.x'
  npm_config_cache: $(Pipeline.Workspace)/.npm

stages:
  - stage: CI
    displayName: Integracion continua
    jobs:
      - job: build_test_package
        displayName: Build, pruebas y empaquetado
        steps:
          - checkout: self
            clean: true
            displayName: Checkout

          - task: NodeTool@0
            displayName: Instalar Node.js $(nodeVersion)
            inputs:
              versionSpec: $(nodeVersion)

          - script: npm ci
            displayName: Restaurar dependencias (npm ci)

          - script: npm run build
            displayName: Build

          # PostgreSQL efimero en Docker (Docker Desktop debe estar corriendo en el agente).
          # Proyecto y puerto propios (arrowops-ci, 5434) para no tocar la base local de desarrollo.
          # POSTGRES_PASSWORD es una variable SECRETA del pipeline: hay que mapearla con env.
          - script: docker compose -p arrowops-ci -f database/docker-compose.yml up -d --wait
            displayName: Levantar PostgreSQL (docker compose)
            env:
              POSTGRES_PASSWORD: $(POSTGRES_PASSWORD)
              ARROWOPS_DB_PORT: 5434

          - script: npm run test:ci
            displayName: Pruebas con cobertura (incluye integracion con PostgreSQL)
            env:
              DATABASE_URL: postgres://arrowops:$(POSTGRES_PASSWORD)@localhost:5434/arrowops

          - script: docker compose -p arrowops-ci -f database/docker-compose.yml down -v
            displayName: Bajar PostgreSQL
            condition: always()
            env:
              POSTGRES_PASSWORD: $(POSTGRES_PASSWORD)

          - task: PublishTestResults@2
            displayName: Publicar resultados de pruebas
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: reports/junit.xml
              testRunTitle: ArrowOps $(Build.BuildNumber)
              failTaskOnFailedTests: true

          - task: PublishCodeCoverageResults@2
            displayName: Publicar cobertura
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: coverage/cobertura-coverage.xml

          # Bloqueante: cualquier vulnerabilidad alta o critica en produccion rompe el build.
          - script: npm audit --omit=dev --audit-level=high
            displayName: Revision de dependencias de produccion (bloqueante)

          # Informativo: reporte completo, incluidas las de desarrollo (ver docs/dependencias.md).
          # Registra una advertencia en lugar de marcar el paso como fallido.
          # Bloque literal (|) para que YAML no tome "##vso" como comentario; "call" devuelve
          # el control a cmd tras npm.cmd y "exit /b 0" evita heredar el codigo de npm audit.
          - script: |
              call npm audit
              if errorlevel 1 echo ##vso[task.logissue type=warning]npm audit reporta vulnerabilidades en dependencias de desarrollo, ver docs/dependencias.md
              exit /b 0
            displayName: Reporte completo de dependencias (informativo)

          - script: npm pack --pack-destination "$(Build.ArtifactStagingDirectory)"
            displayName: Empaquetar artefacto (npm pack)

          - task: PublishPipelineArtifact@1
            displayName: Publicar artefacto
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)
              artifact: arrowops
              publishLocation: pipeline

  # Despliegue continuo a dev: cada merge a main y cada tag de version. Nunca en PR.
  - stage: Deploy_dev
    displayName: Desplegar en dev
    dependsOn: CI
    condition: >-
      and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'),
          or(eq(variables['Build.SourceBranch'], 'refs/heads/main'),
             startsWith(variables['Build.SourceBranch'], 'refs/tags/v')))
    jobs:
      - deployment: deploy_dev
        displayName: arrowops-dev (http://localhost:8081)
        environment: arrowops-dev
        strategy:
          runOnce:
            deploy:
              steps:
                - template: devops/deploy/deploy-steps.yml
                  parameters:
                    project: arrowops-dev
                    port: '8081'
                    postgresPassword: $(POSTGRES_PASSWORD)

  # Release a prod: solo tags vX.Y.Z, despues de dev, con aprobacion manual
  # configurada en el Environment arrowops-prod (Approvals and checks).
  - stage: Deploy_prod
    displayName: Desplegar en prod
    dependsOn: Deploy_dev
    condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
    jobs:
      - deployment: deploy_prod
        displayName: arrowops-prod (http://localhost:8080)
        environment: arrowops-prod
        strategy:
          runOnce:
            deploy:
              steps:
                - template: devops/deploy/deploy-steps.yml
                  parameters:
                    project: arrowops-prod
                    port: '8080'
                    postgresPassword: $(POSTGRES_PASSWORD_PROD)
